{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card mt-5">
        <div class="card-header bg-info text-white">
            <h3><i class="fas fa-key me-2"></i>Rent Item</h3>
        </div>
        <div class="card-body">
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="card-text">{{ item.description }}</p>
            <p><strong>Category:</strong> {{ item.category }}</p>
            <p><strong>Available Quantity:</strong> {{ item.quantity }}</p>
            <p><strong>Price per Day:</strong> ₹{{ '%.2f'|format(item.price) }}</p>

            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="start_date" class="form-label"><i class="fas fa-calendar-alt me-2"></i>Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="end_date" class="form-label"><i class="fas fa-calendar-check me-2"></i>End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label"><i class="fas fa-cubes me-2"></i>Quantity</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="1" max="{{ item.quantity }}" required>
                </div>
                <div class="mb-3">
                    <p><strong>Total Cost:</strong> ₹<span id="totalCost">0.00</span></p>
                </div>
                <button type="submit" class="btn btn-info"><i class="fas fa-key me-2"></i>Rent Now</button>
                <a href="{{ url_for('rent_items') }}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Cancel</a>
            </form>
        </div>
    </div>
</div>

<script>
    function updateTotalCost() {
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;
        const quantity = document.getElementById('quantity').value;
        const pricePerDay = parseFloat('{{ item.price }}');

        if (startDate && endDate && quantity) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
            if (days > 0) {
                const totalCost = (days * pricePerDay * quantity).toFixed(2);
                document.getElementById('totalCost').textContent = totalCost;
            }
        }
    }

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('start_date').min = today;
    document.getElementById('end_date').min = today;

    // Add event listeners
    document.getElementById('start_date').addEventListener('input', updateTotalCost);
    document.getElementById('end_date').addEventListener('input', updateTotalCost);
    document.getElementById('quantity').addEventListener('input', updateTotalCost);
</script>
{% endblock %}
