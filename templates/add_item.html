<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                              url('https://images.unsplash.com/photo-1581579186913-45ac24ed53d2?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1470&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-item-container {
            background-color: rgba(44, 62, 80, 0.9);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
        }
        .form-label {
            color: #ecf0f1;
            font-weight: 500;
        }
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border-color: #3498db;
            box-shadow: none;
        }
        .btn-submit {
            background-color: #3498db;
            border: none;
            transition: transform 0.3s ease;
            color: white;
        }
        .btn-submit:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        .form-icon {
            color: #3498db;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="add-item-container">
            <h1 class="text-center mb-4">
                <i class="fas fa-box-open me-2"></i>Add New Item
            </h1>
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-tag form-icon"></i>Item Name
                        </label>
                        <input type="text" class="form-control" name="name" id="name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">
                            <i class="fas fa-list-alt form-icon"></i>Category
                        </label>
                        <select class="form-select" name="category" id="category" required>
                            <option value="" disabled selected>Select category</option>
                            {% for category in categories %}
                            <option value="{{ category }}">{{ category }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="quantity" class="form-label">
                            <i class="fas fa-cubes form-icon"></i>Quantity
                        </label>
                        <input type="number" class="form-control" name="quantity" id="quantity" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">
                            <i class="fas fa-rupee-sign form-icon"></i>Price
                        </label>
                        <input type="number" class="form-control" name="price" id="price" step="0.01" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mode" class="form-label">
                            <i class="fas fa-exchange-alt form-icon"></i>Mode
                        </label>
                        <select class="form-select" name="mode" id="mode" required>
                            <option value="" disabled selected>Select mode</option>
                            <option value="rent">Rent</option>
                            <option value="share">Share</option>
                            <option value="sale">Sale</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="condition" class="form-label">
                            <i class="fas fa-star form-icon"></i>Condition
                        </label>
                        <select class="form-select" name="condition" id="condition" required>
                            <option value="" disabled selected>Select condition</option>
                            {% for condition in conditions %}
                            <option value="{{ condition }}">{{ condition }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">
                        <i class="fas fa-info-circle form-icon"></i>Description
                    </label>
                    <textarea class="form-control" name="description" id="description" rows="3" required
                        placeholder="Describe the item's condition, features, and any other relevant details..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="photo" class="form-label">
                        <i class="fas fa-camera form-icon"></i>Item Photo
                    </label>
                    <input type="file" class="form-control" name="photo" id="photo" accept="image/*" required>
                    <div class="form-text text-light">Upload a clear photo of your item (max size: 5MB)</div>
                    <div id="photoPreview" class="mt-2" style="display: none;">
                        <img id="preview" src="#" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 8px;">
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-submit btn-lg">
                        <i class="fas fa-plus me-2"></i>Add Item
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        // Photo preview
        document.getElementById('photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) { // 5MB
                    alert('File size must be less than 5MB');
                    this.value = '';
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
